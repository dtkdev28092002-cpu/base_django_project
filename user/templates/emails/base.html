<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}Email{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
    .header { background-color: #4f46e5; padding: 24px 32px; }
    .header h1 { margin: 0; color: #ffffff; font-size: 22px; }
    .body { padding: 32px; color: #374151; font-size: 15px; line-height: 1.6; }
    .footer { padding: 16px 32px; background-color: #f9fafb; text-align: center; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>{% block header %}Notification{% endblock %}</h1>
    </div>
    <div class="body">
      {% block content %}
        {% if name %}<p>Hi {{ name }},</p>{% endif %}
        <p>{{ body }}</p>
        {% if action_url %}<a href="{{ action_url }}" style="display:inline-block;padding:10px 20px;background-color:#4f46e5;color:#ffffff;text-decoration:none;border-radius:6px;font-size:14px;">Click here</a>{% endif %}
      {% endblock %}
    </div>
    <div class="footer">
      {% block footer %}&copy; {{ year }} {{ site_name|default:"My App" }}. All rights reserved.{% endblock %}
    </div>
  </div>
</body>
</html>
